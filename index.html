<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project JHS</title>
<meta name="description" content="Project JHS — 게임을 만듭니다.">
<style>
  :root {
    --deep: #070b16; --wall: #141a2e; --panel: #19203a;
    --ink: #dfe6f5; --dim: #8794b5; --faint: #5f6d99; --red: #c02020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep); color: var(--ink);
    font: 16px/1.75 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    padding: 64px 20px 90px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 56px; }
  h1 { font-size: 34px; letter-spacing: -.01em; }
  .tag { color: var(--dim); margin-top: 8px; }
  h2 { font-size: 15px; color: var(--faint); letter-spacing: .08em;
       margin: 0 0 18px; font-weight: 600; }
  .game {
    display: flex; gap: 18px; align-items: flex-start;
    background: var(--wall); border: 1px solid #232b48;
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
  }
  .game img { width: 76px; height: 76px; border-radius: 17px; flex: none; }
  .game .body { min-width: 0; }
  .game .name { font-size: 19px; font-weight: 700; line-height: 1.35; }
  .game .say { color: var(--dim); font-size: 15px; margin-top: 6px; }
  .game .links { margin-top: 12px; font-size: 14px; }
  .game .links a { color: var(--faint); text-decoration: none;
                   border-bottom: 1px solid #2b3450; }
  .game .links a:hover { color: var(--ink); border-color: var(--faint); }
  .game .links span { color: #2b3450; margin: 0 10px; }
  .soon { color: var(--faint); font-size: 15px; padding: 4px 2px; }
  /* 아직 안 낸 것 — 아이콘이 없으므로 글만 담습니다. 빈 네모를 두느니
     칸을 안 만드는 편이 낫습니다. */
  .making { background: none; border: 1px dashed #232b48; }
  .making .name { font-size: 17px; }
  footer { margin-top: 60px; padding-top: 26px; border-top: 1px solid #1b2238;
           color: var(--faint); font-size: 14px; }
  footer a { color: var(--dim); }
  @media (max-width: 480px) {
    body { padding: 44px 18px 70px; }
    h1 { font-size: 28px; }
    .game { gap: 14px; padding: 16px; }
    .game img { width: 60px; height: 60px; border-radius: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Project JHS</h1>
    <p class="tag">게임을 만듭니다.</p>
  </header>

  <h2>만든 것</h2>

  <div class="game">
    <img src="icon.png" alt="">
    <div class="body">
      <div class="name">오늘도 탑을 오르는 나는 무슨 생각을 해야 할까</div>
      <div class="say">한 손으로 오르는 탑. 왼쪽·위·오른쪽 중 한 칸을 고를 뿐입니다.</div>
      <div class="links">
        <a href="privacy/whileclimbing.html">개인정보처리방침</a>
      </div>
    </div>
  </div>

  <h2 style="margin-top:44px">만들고 있는 것</h2>

  <div class="game making">
    <div class="body">
      <div class="name">벅스마스터</div>
      <div class="say">곤충을 채집하고 육성하며 대결하는 게임.</div>
    </div>
  </div>

  <p class="soon">그리고 몇 가지가 더 있습니다.</p>

  <footer>
    문의는 Google Play 스토어 등록정보의 연락처로 주세요.
  </footer>

</div>
</body>
</html>
